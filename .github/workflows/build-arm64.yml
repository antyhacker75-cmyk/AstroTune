name: Build ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Secrets & Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > bitchord-release.jks
          echo "storeFile=bitchord-release.jks" > keystore.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> keystore.properties
          echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
          
          echo "LASTFM_API_KEY=$LASTFM_API_KEY" > local.properties
          echo "LISTEN_TOGETHER_SERVER=https://bitchord-b96t.onrender.com" >> local.properties

      - name: Build Only ARM64 Release APK
        run: |
          mkdir -p wearos/build/outputs/apk/prod/release
          touch wearos/build/outputs/apk/prod/release/dummy.apk
          ./gradlew :app:assembleProdRelease -Pandroid.injected.build.abi=arm64-v8a -x :wearos:assembleProdRelease

      - name: Find APK Location
        run: find app/build/outputs/apk/prod/release/ -name "*.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-arm64-v8a-release
          path: app/build/outputs/apk/prod/release/**/*.apk
