<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Parties · AstroTune</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0f] text-gray-100 font-sans min-h-screen p-6">
  <div class="max-w-4xl mx-auto">
    <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight flex items-center gap-3">
          <svg class="w-8 h-8 text-indigo-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          AstroTune Parties
        </h1>
        <p class="text-gray-400 mt-1">Join a party to listen together in real time.</p>
      </div>
      <div class="relative w-full md:w-72">
        <svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="search" placeholder="Search host, code, or track..." class="w-full bg-[#14141c] border border-gray-700 text-white rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-indigo-500 transition-colors">
      </div>
    </header>

    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    <div id="empty" class="text-center text-gray-500 mt-12 hidden">
      <p class="text-lg">No active parties found</p>
    </div>
  </div>

<script>
let allParties = [];

function createCard(p) {
  const a = document.createElement('a');
  a.href = `/invite/${p.code}`;
  a.className = 'card fade-in block relative bg-[#14141c] border border-[#2a2a3a] rounded-xl p-5 hover:border-indigo-500 transition-colors group';
  a.id = `card-${p.code}`;
  a.innerHTML = `
    <div class="flex justify-between items-start mb-3">
      <div>
        <div class="text-xs text-gray-500 font-semibold tracking-wider uppercase mb-1">Host</div>
        <div class="font-semibold text-lg text-white group-hover:text-indigo-400 transition-colors">${p.host}</div>
      </div>
      <div class="flex items-center gap-2">
        <div class="bg-indigo-500/10 text-indigo-400 px-3 py-1 rounded-full text-sm font-mono font-bold tracking-widest border border-indigo-500/20">
          ${p.code}
        </div>
        <button onclick="event.preventDefault(); event.stopPropagation(); navigator.clipboard.writeText('${p.code}'); this.innerHTML='<svg class=\\'w-4 h-4 text-green-400\\' fill=\\'none\\' stroke=\\'currentColor\\' viewBox=\\'0 0 24 24\\'><path stroke-linecap=\\'round\\' stroke-linejoin=\\'round\\' stroke-width=\\'2\\' d=\\'M5 13l4 4L19 7\\'/></svg>'; setTimeout(() => this.innerHTML='<svg class=\\'w-4 h-4 text-gray-400\\' fill=\\'none\\' stroke=\\'currentColor\\' viewBox=\\'0 0 24 24\\'><path stroke-linecap=\\'round\\' stroke-linejoin=\\'round\\' stroke-width=\\'2\\' d=\\'M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z\\'/></svg>', 2000)" class="p-1.5 bg-[#1a1a24] hover:bg-gray-700 rounded-lg border border-gray-700 transition-colors" title="Copy Code">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        </button>
      </div>
    </div>
    
    <div class="flex flex-wrap items-center gap-2 mb-4">
      <div class="flex items-center gap-2 text-xs text-green-400 bg-green-400/10 px-2.5 py-1 rounded-full">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
        </span>
        <span id="users-${p.code}">${p.users} listening</span>
      </div>
      
      <div class="flex items-center gap-2 text-xs text-indigo-400 bg-indigo-400/10 px-2.5 py-1 rounded-full">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        <span id="msgs-${p.code}">${p.messages} msgs</span>
      </div>

      <div class="flex items-center gap-2 text-xs ${p.hostOnly ? 'text-amber-400 bg-amber-400/10' : 'text-blue-400 bg-blue-400/10'} px-2.5 py-1 rounded-full">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${p.hostOnly ? 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z' : 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z'}" /></svg>
        <span>${p.hostOnly ? 'Host Control' : 'Everyone'}</span>
      </div>
    </div>

    <div class="border-t border-gray-800 pt-3 flex items-center gap-3 text-gray-400 text-sm overflow-hidden">
      <img id="art-${p.code}" src="https://ui-avatars.com/api/?name=Music&background=1f2937&color=818cf8" class="w-10 h-10 rounded object-cover">
      <div class="flex-1 min-w-0">
        <div class="truncate text-white font-medium mb-1" id="track-${p.code}">${p.nowPlaying || 'Nothing playing'}</div>
        <div class="w-full bg-gray-800 rounded-full h-1">
          <div id="prog-${p.code}" class="bg-indigo-500 h-1 rounded-full transition-all duration-1000" style="width: 0%"></div>
        </div>
      </div>
    </div>
  `;
  return a;
}

function updateCard(el, p) {
  el.querySelector(`#users-${p.code}`).innerText = `${p.users} listening`;
  el.querySelector(`#msgs-${p.code}`).innerText = `${p.messages} msgs`;
  
  const trackEl = el.querySelector(`#track-${p.code}`);
  const newTrack = p.nowPlaying || 'Nothing playing';
  if (trackEl.innerText !== newTrack) trackEl.innerText = newTrack;
  
  if (p.artwork) el.querySelector(`#art-${p.code}`).src = p.artwork;
  
  if (p.duration > 0) {
    const percent = Math.min((p.progress / p.duration) * 100, 100);
    el.querySelector(`#prog-${p.code}`).style.width = `${percent}%`;
  }
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = allParties.filter(p => 
    (p.code && p.code.toLowerCase().includes(q)) || 
    (p.host && p.host.toLowerCase().includes(q)) || 
    (p.nowPlaying && p.nowPlaying.toLowerCase().includes(q))
  );

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  
  empty.classList.add('hidden');
  filtered.forEach(p => {
    let existing = document.getElementById(`card-${p.code}`);
    if (existing) updateCard(existing, p);
    else grid.appendChild(createCard(p));
  });
}

async function fetchParties() {
  try {
    const res = await fetch('/api/parties');
    allParties = await res.json();
    render();
  } catch (e) { console.error(e); }
}

document.getElementById('search').addEventListener('input', render);
fetchParties();
setInterval(fetchParties, 2000);
</script>
</body>
</html>
