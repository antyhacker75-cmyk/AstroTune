<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Party {{.Code}} · AstroTune</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0f] text-gray-100 font-sans min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-[#14141c] border border-[#2a2a3a] rounded-2xl p-8 text-center shadow-2xl">
    <div class="text-xs text-gray-500 font-semibold tracking-wider uppercase mb-2">Party Code</div>
    <div class="text-5xl font-mono font-bold tracking-widest text-indigo-400 mb-6">{{.Code}}</div>

    <div class="flex items-center justify-center gap-2 text-green-400 bg-green-400/10 px-4 py-2 rounded-full w-fit mx-auto mb-8">
      <span class="relative flex h-3 w-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
      </span>
      <span id="member-count" class="font-semibold text-lg">{{.Members}}</span>
      <span class="text-sm">listening</span>
    </div>

    <div class="bg-[#0a0a0f] rounded-xl p-4 mb-8 text-left">
      <div class="flex items-center gap-4 mb-3">
        <img id="artwork" src="https://ui-avatars.com/api/?name=Music&background=1f2937&color=818cf8" class="w-14 h-14 rounded-lg object-cover shadow-lg" alt="Artwork">
        <div class="overflow-hidden flex-1">
          <div class="text-xs text-gray-500 uppercase tracking-wider mb-1">Now Playing</div>
          <div id="now-playing" class="text-sm font-semibold truncate">{{.NowPlaying}}</div>
        </div>
      </div>
      <div class="flex justify-between text-xs text-gray-500 mb-1 font-mono">
        <span id="current-time">0:00</span>
        <span id="total-time">0:00</span>
      </div>
      <div class="w-full bg-gray-800 rounded-full h-1.5">
        <div id="progress-bar" class="bg-indigo-500 h-1.5 rounded-full transition-all duration-1000 ease-linear" style="width: 0%"></div>
      </div>
    </div>

    <a href="{{.DeepLink}}" class="block w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition-colors shadow-lg shadow-indigo-600/30">
      Join Party in AstroTune
    </a>
    
    <p class="text-gray-500 text-sm mt-4">Don't have the app? <a href="https://github.com/antyhacker75-cmyk/BitChord/releases" class="text-indigo-400 hover:underline">Download AstroTune here</a>.</p>
  </div>

<script>
  function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return "0:00";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  setInterval(async () => {
    try {
      const res = await fetch(`/api/parties/{{.Code}}/preview`);
      if (!res.ok) return;
      const data = await res.json();
      
      document.getElementById('member-count').innerText = data.members;
      document.getElementById('now-playing').innerText = data.nowPlaying || 'Nothing playing';
      
      const cur = data.progress || 0;
      const dur = data.duration || 0;
      
      if (dur > 0) {
        document.getElementById('current-time').innerText = formatTime(cur);
        document.getElementById('total-time').innerText = formatTime(dur);
        const percent = Math.min((cur / dur) * 100, 100);
        document.getElementById('progress-bar').style.width = `${percent}%`;
      }
      if (data.artwork && data.artwork !== "") {
        document.getElementById('artwork').src = data.artwork;
      }
    } catch (e) { console.error(e); }
  }, 1000);
</script>
</body>
</html>
